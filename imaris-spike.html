<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imaris on upstream kiln</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #ddd;
        font: 13px system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Splats on their own canvas; the volume canvas keeps the camera controls. */
      #splats {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #splats[hidden] {
        display: none;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        max-width: 44em;
        padding: 8px 10px;
        background: rgb(0 0 0 / 0.7);
        border-radius: 6px;
        white-space: pre-wrap;
      }
      #panel button {
        margin: 4px 4px 0 0;
      }
    </style>
  </head>
  <body>
    <canvas id="volume"></canvas>
    <canvas id="splats" hidden></canvas>
    <div id="panel">
      <output id="status">Opening…</output>
      <div id="channels"></div>
      <div id="splatControls"></div>
      <output id="splatStatus"></output>
    </div>
    <!-- ?url=<.ims URL> to open another file. -->
    <script type="module" src="/src/lib/volume/imaris/spike.ts"></script>
  </body>
</html>
